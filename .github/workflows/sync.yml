name: Kindle to Notion 6-Hour Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & System Deps
        run: npx playwright install --with-deps chromium

      - name: Execute Kindle to Notion Sync Engine
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BOOKS_DATABASE_ID: ${{ secrets.NOTION_BOOKS_DATABASE_ID }}
          NOTION_HIGHLIGHTS_DATABASE_ID: ${{ secrets.NOTION_HIGHLIGHTS_DATABASE_ID }}
          AMAZON_DOMAIN: ${{ secrets.AMAZON_DOMAIN || 'amazon.com' }}
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
        run: npm run sync
